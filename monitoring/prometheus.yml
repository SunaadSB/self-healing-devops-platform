global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'user-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:8001']

  - job_name: 'order-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:8002']

  - job_name: 'payment-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:8003']