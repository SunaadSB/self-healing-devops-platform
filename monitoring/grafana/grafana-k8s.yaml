apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ai-self-healing
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30030

