apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "user-service"
        static_configs:
          - targets: ["user-service:8000"]

      - job_name: "order-service"
        static_configs:
          - targets: ["order-service:8001"]

      - job_name: "payment-service"
        static_configs:
          - targets: ["payment-service:8002"]