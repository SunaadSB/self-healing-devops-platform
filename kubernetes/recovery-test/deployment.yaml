apiVersion: apps/v1
kind: Deployment
metadata:
  name: recovery-test
  namespace: ai-self-healing
  labels:
    app: recovery-test
    purpose: self-healing-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recovery-test
  template:
    metadata:
      labels:
        app: recovery-test
        purpose: self-healing-validation
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
